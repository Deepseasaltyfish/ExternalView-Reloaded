modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/Deepseasaltyfish/ExternalView-Reloaded/issues"


[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="https://github.com/Deepseasaltyfish/ExternalView-Reloaded"
logoFile="logo.png"
credits="Ported to 1.20 Forge by SaltyFish."


[[mixins]]
config="${mod_id}.mixins.json"


[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"


[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
